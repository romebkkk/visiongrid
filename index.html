<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionGrid v2.0 — Prevención de ceguera (Rejilla de Amsler Calibrada ISO 7810 y Pelli-Robson)</title>
  <meta name="description" content="Auto-monitorización macular con Rejilla de Amsler calibrada a 20º visuales mediante tarjeta ISO y test Pelli-Robson de Glaucoma. 100% privado en tu navegador.">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --primary: #38BDF8;
      --danger: #EF4444;
      --warning: #F59E0B;
      --success: #10B981;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.35rem;
      border-radius: 12px;
      overflow-x: auto;
    }
    .tab-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #0F172A;
    }

    /* Calibrador de Pantalla */
    .calib-card {
      background: #0B132B;
      border: 2px dashed var(--primary);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .virtual-card {
      height: 54px;
      background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
      border: 2px solid #60A5FA;
      border-radius: 8px;
      margin: 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
      max-width: 100%;
    }

    /* Amsler Grid */
    .amsler-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    #amslerCanvas {
      background: #000000;
      border: 3px solid #64748B;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    .amsler-controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      margin-top: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.5rem;
      background: var(--primary);
      color: #0F172A;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    /* Test de Contraste */
    .contrast-stage {
      background: #FFFFFF;
      color: #000000;
      border-radius: 16px;
      padding: 3rem 1rem;
      text-align: center;
      margin-bottom: 1.5rem;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .contrast-text {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      user-select: none;
    }

    .contrast-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .btn-digit {
      padding: 1rem;
      background: #0F172A;
      color: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-digit:hover { border-color: var(--primary); }

    .result-alert {
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1.25rem;
      border-left: 5px solid;
    }
    .res-urgente { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #FCA5A5; }
    .res-preferente { background: rgba(245, 158, 11, 0.2); border-color: var(--warning); color: #FCD34D; }
    .res-normal { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #6EE7B7; }

    pre.dossier {
      background: #030712;
      border: 1px solid #1E293B;
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #93C5FD;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">👁️ PROTOCOLO OFTALMOLÓGICO v2.0 · CALIBRACIÓN ISO 7810</div>
    <h1>VisionGrid</h1>
    <p class="subtitle">Auto-monitorización de DMAE (Amsler a 20º de campo macular) y contraste (Glaucoma)</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabAmsler" onclick="cambiarTab('amsler')">🕸️ Rejilla de Amsler (Mácula)</button>
    <button class="tab-btn" id="tabContrast" onclick="cambiarTab('contrast')">🌗 Test de Contraste (Pelli-Robson)</button>
    <button class="tab-btn" id="tabDossier" onclick="cambiarTab('dossier')">📋 Dossier para Retinólogo</button>
  </div>

  <div class="card" id="mainContent">
    <!-- Contenido dinámico -->
  </div>
</div>

<script src="visiongrid.js"></script>
<script>
  'use strict';

  var tabActual = 'amsler';
  var marcasAmsler = [];
  var lineasOnduladasDetectadas = false;
  var zonasBorradasDetectadas = false;
  var ojoSeleccionado = 'derecho';

  // Calibración de pantalla (ancho en píxeles de tarjeta ISO 85.6mm)
  var anchoTarjetaPx = 320;
  var distanciaOjoCm = 33;

  // Estado del test de contraste
  var nivelContrasteActual = 1;
  var digitoCorrecto = 5;

  function cambiarTab(tab) {
    tabActual = tab;
    document.getElementById('tabAmsler').classList.toggle('active', tab === 'amsler');
    document.getElementById('tabContrast').classList.toggle('active', tab === 'contrast');
    document.getElementById('tabDossier').classList.toggle('active', tab === 'dossier');

    if (tab === 'amsler') renderAmsler();
    else if (tab === 'contrast') renderContrast();
    else renderDossier();
  }

  function renderAmsler() {
    var calib = VisionGrid.calibrarPantallaISO(anchoTarjetaPx, distanciaOjoCm);
    var canvasSize = Math.max(300, Math.min(480, calib.tamanoRejillaAmslerPx));

    var main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="calib-card">
        <h4 style="color:#38BDF8; font-size:1.05rem; margin-bottom:0.25rem;">📐 Calibración Óptica de Pantalla (ISO/IEC 7810)</h4>
        <p style="font-size:0.85rem; color:#CBD5E1;">
          Apoya una tarjeta de crédito, débito o DNI sobre la tarjeta azul y ajusta el deslizador hasta que coincidan exactamente en anchura. Esto garantiza que la rejilla cubra exactamente <strong>20º de campo macular a 33 cm</strong>.
        </p>
        <div class="virtual-card" id="virtualCard" style="width:${anchoTarjetaPx}px;">
          💳 DNI / Tarjeta Bancaria (85.6 mm)
        </div>
        <div style="display:flex; justify-content:center; align-items:center; gap:12px; margin-top:0.5rem;">
          <small>Más estrecha</small>
          <input type="range" min="200" max="450" value="${anchoTarjetaPx}" oninput="actualizarCalibracion(this.value)" style="width:200px;">
          <small>Más ancha</small>
        </div>
        <div style="font-size:0.8rem; color:#94A3B8; margin-top:0.5rem;">
          Resolución calculada: <strong>${calib.pxPorMm} px/mm</strong> (${calib.dpiEstimado} DPI) · Tamaño físico Amsler: <strong>10 × 10 cm</strong>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="font-size:1.25rem;">Test de la Rejilla de Amsler</h3>
        <select id="ojoSelect" onchange="ojoSeleccionado=this.value" style="background:#0F172A; color:white; border:1px solid var(--border); padding:0.4rem 0.75rem; border-radius:8px;">
          <option value="derecho" ${ojoSeleccionado==='derecho'?'selected':''}>Ojo Derecho (tapar izquierdo)</option>
          <option value="izquierdo" ${ojoSeleccionado==='izquierdo'?'selected':''}>Ojo Izquierdo (tapar derecho)</option>
        </select>
      </div>

      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">
        <strong>Instrucciones:</strong> Si usas gafas de lectura, póntelas. Tápate un ojo. Mira <strong>FIJAMENTE al punto blanco central</strong> a unos 33 cm de distancia. Sin apartar la mirada del centro, haz clic sobre cualquier zona donde veas líneas onduladas o manchas borrosas.
      </p>

      <div class="amsler-wrapper">
        <canvas id="amslerCanvas" width="${canvasSize}" height="${canvasSize}"></canvas>

        <div style="display:flex; gap:12px; margin-top:0.75rem; font-size:0.85rem;">
          <label style="cursor:pointer;"><input type="checkbox" id="chkOnduladas" onchange="lineasOnduladasDetectadas=this.checked; evaluarYMostrarAmsler();"> Veo líneas torcidas/onduladas</label>
          <label style="cursor:pointer;"><input type="checkbox" id="chkBorradas" onchange="zonasBorradasDetectadas=this.checked; evaluarYMostrarAmsler();"> Veo zonas borradas o ciegas</label>
        </div>

        <div class="amsler-controls">
          <button class="btn btn-secondary" onclick="marcasAmsler=[]; renderAmsler();">🔄 Limpiar marcas</button>
          <button class="btn" onclick="evaluarYMostrarAmsler()">Diagnosticar Rejilla</button>
        </div>
      </div>

      <div id="resultadoAmslerBox"></div>
    `;

    iniciarCanvasAmsler(canvasSize);
  }

  function actualizarCalibracion(val) {
    anchoTarjetaPx = parseInt(val, 10);
    document.getElementById('virtualCard').style.width = anchoTarjetaPx + 'px';
    var calib = VisionGrid.calibrarPantallaISO(anchoTarjetaPx, distanciaOjoCm);
    renderAmsler();
  }

  function iniciarCanvasAmsler(size) {
    var canvas = document.getElementById('amslerCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var cells = 20;
    var cellSize = size / cells;

    function dibujar() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1;

      for (var i = 0; i <= cells; i++) {
        var pos = i * cellSize;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(size, pos);
        ctx.stroke();
      }

      // Punto central blanco foveal
      var centro = size / 2;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(centro, centro, cellSize * 0.35, 0, Math.PI * 2);
      ctx.fill();

      // Dibujar marcas del usuario
      marcasAmsler.forEach(function (m) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.6)';
        ctx.beginPath();
        ctx.arc(m.x * cellSize + cellSize / 2, m.y * cellSize + cellSize / 2, cellSize * 0.45, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    canvas.addEventListener('click', function (e) {
      var rect = canvas.getBoundingClientRect();
      var clickX = e.clientX - rect.left;
      var clickY = e.clientY - rect.top;
      var cellX = Math.floor(clickX / cellSize);
      var cellY = Math.floor(clickY / cellSize);

      marcasAmsler.push({ x: cellX, y: cellY, tipo: 'anomalia' });
      dibujar();
      evaluarYMostrarAmsler();
    });

    dibujar();
  }

  function evaluarYMostrarAmsler() {
    var res = VisionGrid.evaluarAmsler({
      lineasOnduladas: lineasOnduladasDetectadas,
      zonasBorradas: zonasBorradasDetectadas,
      zonasMarcadas: marcasAmsler
    });

    var box = document.getElementById('resultadoAmslerBox');
    if (!box) return;

    var clase = res.urgencia === 'urgente' ? 'res-urgente' : (res.urgencia === 'preferente' ? 'res-preferente' : 'res-normal');

    box.innerHTML = `
      <div class="result-alert ${clase}">
        <h4 style="font-size:1.15rem; margin-bottom:0.25rem;">${res.diagnosticoOrientativo}</h4>
        <p style="font-size:0.95rem; line-height:1.4;">${res.recomendacion}</p>
        ${res.afectacionCentralFoveal ? '<div style="margin-top:6px; font-weight:700;">⚠️ AFECTACIÓN EN ZONA CENTRAL FOVEAL (<3.5º)</div>' : ''}
      </div>
    `;
  }

  function renderContrast() {
    var main = document.getElementById('mainContent');
    var info = VisionGrid.NIVELES_CONTRASTE[nivelContrasteActual - 1];

    main.innerHTML = `
      <h3 style="font-size:1.25rem; margin-bottom:0.35rem;">Test de Sensibilidad al Contraste (Pelli-Robson Adaptado)</h3>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">
        La pérdida de contraste es el signo más temprano del <strong>Glaucoma</strong> (daño del nervio óptico) y suele pasar desapercibido en pruebas de agudeza visual estándar. Pon el brillo de tu pantalla al 80-100% y selecciona el número que ves en el recuadro blanco:
      </p>

      <div style="font-size:0.85rem; color:var(--primary); font-weight:700; margin-bottom:0.5rem;">
        Nivel ${nivelContrasteActual} / 8 (Contraste ${info.contrastePct}% · logCS ${info.logCS})
      </div>

      <div class="contrast-stage">
        <div class="contrast-text" style="color:${info.hexColor};">${digitoCorrecto}</div>
      </div>

      <div class="contrast-buttons">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
          return '<button class="btn-digit" onclick="responderContraste(' + n + ')">' + n + '</button>';
        }).join('')}
      </div>

      <div id="resultadoContrasteBox"></div>
    `;
  }

  function responderContraste(num) {
    if (num === digitoCorrecto) {
      if (nivelContrasteActual < 8) {
        nivelContrasteActual++;
        digitoCorrecto = Math.floor(Math.random() * 9) + 1;
        renderContrast();
      } else {
        mostrarFinContraste(true);
      }
    } else {
      mostrarFinContraste(false);
    }
  }

  function mostrarFinContraste(exitoTotal) {
    var evalRes = VisionGrid.evaluarContraste(nivelContrasteActual);
    var box = document.getElementById('resultadoContrasteBox');
    box.innerHTML = `
      <div class="result-alert ${evalRes.estado === 'optimo' ? 'res-normal' : (evalRes.estado === 'moderado' ? 'res-preferente' : 'res-urgente')}">
        <h4>Sensibilidad al contraste alcanzada: Nivel ${evalRes.nivelAlcanzado} / 8 (logCS ${evalRes.logCS})</h4>
        <p style="margin-top:0.25rem;">${evalRes.mensajeClinico}</p>
      </div>
      <div style="text-align:center; margin-top:1rem;">
        <button class="btn btn-secondary" onclick="nivelContrasteActual=1; digitoCorrecto=Math.floor(Math.random()*9)+1; renderContrast();">Reiniciar test de contraste</button>
      </div>
    `;
  }

  function renderDossier() {
    var main = document.getElementById('mainContent');
    var dossier = VisionGrid.generarDossierRetinologo({
      ojo: ojoSeleccionado,
      amsler: {
        lineasOnduladas: lineasOnduladasDetectadas,
        zonasBorradas: zonasBorradasDetectadas,
        zonasMarcadas: marcasAmsler
      },
      contrasteNivel: nivelContrasteActual
    });

    main.innerHTML = `
      <h3 style="font-size:1.25rem; margin-bottom:0.35rem;">Dossier Oftalmológico para Retinólogo / Especialista</h3>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">
        Informe estructurado con los cuadrantes retinianos y escala logCS para entregar en tu revisión oftalmológica:
      </p>

      <pre class="dossier">${dossier.textoPlano}</pre>

      <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
        <button class="btn" onclick="copiarDossier()">📋 Copiar Informe</button>
        <button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
      </div>
    `;
  }

  function copiarDossier() {
    var texto = document.querySelector('pre.dossier').textContent;
    navigator.clipboard.writeText(texto).then(function () {
      alert('Informe oftalmológico copiado al portapapeles.');
    });
  }

  window.addEventListener('DOMContentLoaded', function () {
    renderAmsler();
  });
</script>

</body>
</html>
